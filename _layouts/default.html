<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.nav != 'home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% include fonts.html %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/icons.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/home/' | relative_url }}">{{ site.title }}</a>
      <nav class="nav">
        <!-- <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} class="active"{% endif %}>Home</a>
        <a href="{{ '/work/' | relative_url }}"{% if page.nav == 'work' %} class="active"{% endif %}>Work</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.nav == 'projects' %} class="active"{% endif %}>Projects</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.nav == 'blog' %} class="active"{% endif %}>Writing</a> -->
        <a href="{{ '/guestbook/' | relative_url }}"{% if page.nav == 'guestbook' %} class="active"{% endif %}>Guestbook</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="copy">© {{ 'now' | date: "%Y" }} {{ site.author }}</span>
      <div class="links">
        <a href="{{ site.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><i class="icon icon-linkedin"></i></a>
        <a href="mailto:{{ site.email }}" aria-label="Email" title="Email"><i class="icon icon-mail"></i></a>
        <a href="{{ site.github }}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><i class="icon icon-github"></i></a>
      </div>
    </div>
  </footer>
</body>
</html>
