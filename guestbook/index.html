<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestbook · Sukma Ragil</title>
<meta name="description" content="Leave a note on the wall.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Trykker&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Trykker&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../assets/css/icons.css">
<link rel="stylesheet" href="../assets/css/guestbook.css">

<!-- ════════════════════════════════════════════════════════════════
     CONFIG — injected at deploy time by .github/workflows/deploy.yml
     from the github-pages environment. Do NOT paste keys here.

     Environment secrets (Settings → Environments → github-pages)
       SUPABASE_URL        Project Settings → API → Project URL
       SUPABASE_ANON_KEY   Project Settings → API → anon public key

     Environment variables
       OPEN_FEEDBACK       "true" or "false"
       SUPABASE_TABLE      table name (default "guestbook")
       HOME_URL            "back to site" link (defaults to the
                           site's baseurl; "" removes the link)

     Any placeholder left unreplaced (opening the file locally, or a
     variable not set) is treated as empty → browser-only mode.
     ════════════════════════════════════════════════════════════════ -->
<script>
window.GUESTBOOK_CONFIG = {
  supabaseUrl:  "__SUPABASE_URL__",
  supabaseKey:  "__SUPABASE_ANON_KEY__",
  table:        "__SUPABASE_TABLE__",
  openFeedback: "__OPEN_FEEDBACK__",
  homeUrl:      "__HOME_URL__"
};
</script>
</head>

<body>
<header class="site-header">
  <div class="wrap">
    <span class="brand">Sukma Ragil</span>
    <a class="home-link" id="home-link" href="#">← Back to site</a>
  </div>
</header>

<main>
  <section class="page-pad">
    <div class="wrap">
      <div class="gb-hero">
      <h1 class="page-title">Guestbook</h1>
      <p class="section-intro" id="gb-intro">Passing through? ... No account needed.</p>
      </div>
    </div>

    <div class="gb-bleed">
      <div class="gb-board-head">
        <h2 class="label">On the wall</h2>
        <span id="gb-total" class="gb-total"></span>
      </div>
      <div id="gb-board" class="gb-board"></div>
    </div>
  </section>
</main>

<div class="gb-bar" id="gb-bar" hidden>
  <form id="gb-form" class="gb-bar-inner" autocomplete="off">
    <span id="gb-status" class="gb-status" role="status" aria-live="polite"></span>
    <input id="gb-name" class="gb-in-name" type="text" maxlength="32" placeholder="Name (optional)" aria-label="Your name, optional">
    <textarea id="gb-message" class="gb-in-msg" rows="1" maxlength="500" placeholder="Leave a note…" aria-label="Your message"></textarea>
    <div class="gb-color" id="gb-color">
      <button type="button" class="gb-color-btn" id="gb-color-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Note color">
        <span class="gb-color-dot" id="gb-color-dot"></span>
        <span class="gb-color-caret"></span>
      </button>
      <div class="gb-color-pop" id="gb-color-pop" hidden>
        <p class="gb-color-head">Colors</p>
        <div class="gb-color-grid" id="gb-color-grid" role="listbox" aria-label="Note color"></div>
      </div>
    </div>
    <span id="gb-count" class="gb-count">0 / 500</span>
    <button type="submit" class="btn">Pin it</button>
    <input id="gb-website" type="text" class="gb-trap" tabindex="-1" aria-hidden="true" autocomplete="off">
  </form>
</div>

<footer class="site-footer">
  <div class="wrap">
    <span class="copy">© <span id="yr"></span> Sukma Ragil</span>
    <div class="links">
      <a href="https://www.linkedin.com/in/sukmaragil" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><i class="icon icon-linkedin"></i></a>
      <a href="mailto:sukmaragilp@gmail.com" aria-label="Email" title="Email"><i class="icon icon-mail"></i></a>
    </div>
  </div>
</footer>

<script>
(function () {
  var CFG = window.GUESTBOOK_CONFIG || {};

  // An un-substituted __PLACEHOLDER__ means "not configured".
  function val(v, fallback) {
    if (typeof v !== 'string') return v === undefined ? fallback : v;
    return /^__[A-Z_]+__$/.test(v) ? fallback : v;
  }
  CFG.supabaseUrl = val(CFG.supabaseUrl, '');
  CFG.supabaseKey = val(CFG.supabaseKey, '');
  CFG.table = val(CFG.table, 'guestbook') || 'guestbook';
  CFG.homeUrl = val(CFG.homeUrl, '');
  CFG.openFeedback = val(CFG.openFeedback, true);

  var LIVE = !!(CFG.supabaseUrl && CFG.supabaseKey);
  var OPEN = CFG.openFeedback !== false && CFG.openFeedback !== 'false';
  var LS_KEY = 'gb_standalone_notes_v1', LS_LAST = 'gb_standalone_last';
  var MAX_MSG = 500, MAX_NAME = 32, COOLDOWN_MS = 15000, POLL_MS = 5000;
  var PALETTE = [
    ['#f56b66', 'Red'],       ['#f5821f', 'Orange'],  ['#fcc61d', 'Gold'],
    ['#4ed693', 'Green'],     ['#c3d130', 'Olive'],   ['#17b6cf', 'Teal'],
    ['#8fa8e8', 'Periwinkle'],['#efb5e8', 'Orchid'],  ['#fb5c93', 'Magenta'],
    ['#33393b', 'Charcoal'],
    ['#fa8a8a', 'Coral'],     ['#f9ad8a', 'Peach'],   ['#fbe06a', 'Lemon'],
    ['#cbe57a', 'Lime'],      ['#93c95e', 'Leaf'],    ['#8fe6dd', 'Aqua'],
    ['#7fd8ee', 'Sky'],       ['#e8edf4', 'Ice'],     ['#ffc2c9', 'Blush'],
    ['#d9d9c4', 'Sage']
  ];
  var COLORS = PALETTE.map(function (p) { return p[0]; });
  var COLOR_LABELS = PALETTE.map(function (p) { return p[1]; });

  // Relative luminance -> pick note ink that clears 4.5:1 on that background.
  function luminance(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length !== 6) return 1;
    function ch(i) {
      var v = parseInt(h.slice(i, i + 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }
    return 0.2126 * ch(0) + 0.7152 * ch(2) + 0.0722 * ch(4);
  }
  function inkSet(hex) {
    var L = luminance(hex);
    if (L < 0.2488) {
      return { ink: '#ffffff', soft: 'rgba(255,255,255,0.86)', rule: 'rgba(255,255,255,0.3)' };
    }
    // #424a53 only clears 4.5:1 on pale grounds; fall back to full ink on saturated ones.
    return { ink: '#1f2328', soft: L > 0.55 ? '#424a53' : '#1f2328', rule: 'rgba(31,35,40,0.12)' };
  }

  var board = document.getElementById('gb-board');
  var totalEl = document.getElementById('gb-total');
  var bar = document.getElementById('gb-bar');
  var seenIds = {}, first = true;

  document.getElementById('yr').textContent = new Date().getFullYear();

  var homeLink = document.getElementById('home-link');
  if (CFG.homeUrl) homeLink.href = CFG.homeUrl; else homeLink.remove();
  var setupEl = document.getElementById('gb-setup');
  if (!LIVE && setupEl) setupEl.hidden = false;
  if (!OPEN) document.getElementById('gb-intro').textContent = 'A wall of notes from people passing through.';

  function ago(iso) {
    var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (isNaN(s) || s < 60) return 'just now';
    var m = Math.floor(s / 60); if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
    var h = Math.floor(m / 60); if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    var d = Math.floor(h / 24); if (d < 30) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function tilt(seed) {
    var h = 2166136261;
    for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (((h >>> 0) % 2001) / 1000 - 1).toFixed(2);
  }
  function sizeClass(m) {
    var n = (m || '').length;
    return n <= 45 ? 'is-sm' : n <= 105 ? 'is-md' : n <= 175 ? 'is-lg' : 'is-xl';
  }
  function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; } }

  function load() {
    if (!LIVE) return Promise.resolve(lsRead());
    return fetch(CFG.supabaseUrl + '/rest/v1/' + (CFG.table || 'guestbook') +
      '?select=id,name,message,color,created_at&order=created_at.desc&limit=300', {
      headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey }
    }).then(function (r) { if (!r.ok) throw new Error('load'); return r.json(); });
  }

  function save(note) {
    if (!LIVE) {
      var all = lsRead(); all.unshift(note);
      try { localStorage.setItem(LS_KEY, JSON.stringify(all)); } catch (e) {}
      return Promise.resolve([note]);
    }
    return fetch(CFG.supabaseUrl + '/rest/v1/' + (CFG.table || 'guestbook'), {
      method: 'POST',
      headers: {
        apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey,
        'Content-Type': 'application/json', Prefer: 'return=representation'
      },
      body: JSON.stringify({ name: note.name, message: note.message, color: note.color })
    }).then(function (r) { if (!r.ok) throw new Error('save'); return r.json(); });
  }

  function render(notes) {
    board.textContent = '';
    totalEl.textContent = notes.length === 1 ? '1 note' : notes.length + ' notes';
    if (!notes.length) {
      var e = document.createElement('p');
      e.className = 'gb-empty';
      e.textContent = OPEN ? 'No notes yet — be the first to leave one.' : 'No notes on the wall yet.';
      board.appendChild(e);
      return;
    }
    notes.forEach(function (n) {
      var key = String(n.id || n.created_at);
      var el = document.createElement('article');
      el.className = 'gb-note ' + sizeClass(n.message) + (!first && !seenIds[key] ? ' is-new' : '');
      var bg = n.color || COLORS[0];
      var ink = inkSet(bg);
      el.style.background = bg;
      el.style.setProperty('--note-ink', ink.ink);
      el.style.setProperty('--note-ink-soft', ink.soft);
      el.style.setProperty('--note-rule', ink.rule);
      el.style.setProperty('--tilt', tilt(key) + 'deg');
      seenIds[key] = true;

      var p = document.createElement('p');
      p.className = 'gb-note-msg';
      p.textContent = n.message;

      var foot = document.createElement('div');
      foot.className = 'gb-note-foot';
      var who = document.createElement('span');
      who.className = 'gb-note-name';
      who.textContent = n.name && n.name.trim() ? n.name : 'anonymous';
      var when = document.createElement('span');
      when.className = 'gb-note-time';
      when.textContent = ago(n.created_at);
      foot.appendChild(who); foot.appendChild(when);
      el.appendChild(p); el.appendChild(foot);
      board.appendChild(el);
    });
    first = false;
  }

  function refresh() {
    return load().then(render).catch(function () {
      if (!board.children.length) {
        board.textContent = '';
        var e = document.createElement('p');
        e.className = 'gb-empty';
        e.textContent = 'Could not load notes right now. Please try again later.';
        board.appendChild(e);
      }
    });
  }

  if (OPEN) {
    bar.hidden = false;
    document.body.classList.add('gb-bar-on');
    var form = document.getElementById('gb-form');
    var nameEl = document.getElementById('gb-name');
    var msgEl = document.getElementById('gb-message');
    var trapEl = document.getElementById('gb-website');
    var countEl = document.getElementById('gb-count');
    var statusEl = document.getElementById('gb-status');
    var colorWrap = document.getElementById('gb-color');
    var colorBtn = document.getElementById('gb-color-btn');
    var colorDot = document.getElementById('gb-color-dot');
    var colorPop = document.getElementById('gb-color-pop');
    var colorGrid = document.getElementById('gb-color-grid');
    var chosen = COLORS[0];

    function closeColors() {
      colorWrap.classList.remove('is-open');
      colorPop.hidden = true;
      colorBtn.setAttribute('aria-expanded', 'false');
    }
    function openColors() {
      colorWrap.classList.add('is-open');
      colorPop.hidden = false;
      colorBtn.setAttribute('aria-expanded', 'true');
    }

    COLORS.forEach(function (c, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'gb-color-opt';
      b.style.background = c;
      b.setAttribute('role', 'option');
      b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      b.setAttribute('aria-label', COLOR_LABELS[i] || 'Color ' + (i + 1));
      b.title = COLOR_LABELS[i] || 'Color ' + (i + 1);
      b.innerHTML = '<span class="tick">\u2713</span>';
      b.firstChild.style.color = inkSet(c).ink;
      b.addEventListener('click', function () {
        chosen = c;
        colorDot.style.background = c;
        Array.prototype.forEach.call(colorGrid.children, function (x) {
          x.setAttribute('aria-selected', x === b ? 'true' : 'false');
        });
        closeColors();
        colorBtn.focus();
      });
      colorGrid.appendChild(b);
    });
    colorDot.style.background = chosen;

    colorBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (colorPop.hidden) { openColors(); } else { closeColors(); }
    });
    colorPop.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', function () { if (!colorPop.hidden) closeColors(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !colorPop.hidden) { closeColors(); colorBtn.focus(); }
    });

    function grow() { msgEl.style.height = 'auto'; msgEl.style.height = Math.min(msgEl.scrollHeight, 96) + 'px'; }
    function say(t, bad) {
      statusEl.textContent = t || '';
      statusEl.classList.toggle('is-on', !!t);
      statusEl.classList.toggle('is-bad', !!bad);
      if (t) { clearTimeout(say._t); say._t = setTimeout(function () {
        statusEl.textContent = ''; statusEl.classList.remove('is-on'); }, 4000); }
    }
    msgEl.addEventListener('input', function () {
      countEl.textContent = msgEl.value.length + ' / ' + MAX_MSG;
      countEl.classList.toggle('is-over', msgEl.value.length > MAX_MSG);
      grow();
    });
    msgEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    });

    var submitBtn = form.querySelector('button[type=submit]');
    var cdTimer = null;
    function cooldownLeft() {
      var last = 0; try { last = parseInt(localStorage.getItem(LS_LAST) || '0', 10); } catch (e) {}
      return Math.max(0, COOLDOWN_MS - (Date.now() - last));
    }
    function tickCooldown() {
      var left = cooldownLeft();
      if (left > 0) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Wait ' + Math.ceil(left / 1000) + 's';
        submitBtn.title = 'You can post again in ' + Math.ceil(left / 1000) + ' seconds';
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Pin it';
        submitBtn.removeAttribute('title');
        if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
      }
    }
    function startCooldown() {
      if (cdTimer) clearInterval(cdTimer);
      tickCooldown();
      if (cooldownLeft() > 0) cdTimer = setInterval(tickCooldown, 250);
    }
    startCooldown();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (trapEl.value) return;
      var msg = msgEl.value.trim(), who = nameEl.value.trim().slice(0, MAX_NAME);
      if (!msg) { say('Write something first.', true); msgEl.focus(); return; }
      if (msg.length > MAX_MSG) { say('Keep it under ' + MAX_MSG + ' characters.', true); return; }
      if (/(https?:\/\/|www\.)/i.test(msg)) { say('Links are not allowed.', true); return; }
      var left = cooldownLeft();
      if (left > 0) { say('Hold on — ' + Math.ceil(left / 1000) + 's before you can post again.', true); startCooldown(); return; }

      var btn = submitBtn;
      btn.disabled = true; btn.textContent = 'Pinning…';
      save({ id: 'n' + Date.now(), name: who || 'anonymous', message: msg, color: chosen, created_at: new Date().toISOString() })
        .then(function () {
          try { localStorage.setItem(LS_LAST, String(Date.now())); } catch (e3) {}
          msgEl.value = ''; nameEl.value = '';
          countEl.textContent = '0 / ' + MAX_MSG;
          countEl.classList.remove('is-over');
          grow(); say('Pinned. Thanks for stopping by!');
          return refresh();
        })
        .catch(function () { say('Something went wrong — your note was not saved.', true); })
        .then(function () { startCooldown(); });
    });

    var sync = function () { document.body.style.setProperty('--gb-bar-h', bar.offsetHeight + 'px'); };
    sync();
    window.addEventListener('resize', sync);
    if (window.ResizeObserver) new ResizeObserver(sync).observe(bar);
  }

  refresh();
  if (LIVE) {
    setInterval(function () { if (!document.hidden) refresh(); }, POLL_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
  }
})();
</script>
</body>
</html>
