title: Sukma Ragil
tagline: QA Engineer
author: Sukma Ragil
description: >-
  Personal site of Sukma Ragil — QA Engineer focused on test automation,
  reliable CI pipelines, and software quality.

# Where the site lives.
# If your repo is named <username>.github.io, leave both blank.
# If it is a project repo (e.g. github.com/you/portfolio), set:
#   baseurl: "/portfolio"
url: ""
baseurl: ""

# Social / contact (edit these)
linkedin: "https://www.linkedin.com/in/sukmaragil"
github: "https://github.com"
email: "hello@sukmaragil.dev"

# Guestbook input box. This is the LOCAL default only — the deployed value is set by
# .github/workflows/deploy.yml (OPEN_FEEDBACK on the github-pages environment), which overrides it.
open_feedback: true

# Build
markdown: kramdown
permalink: /blog/:title/
timezone: Asia/Jakarta

# Newest posts first in listings
sort_posts: descending

# NOTE: setting `exclude` replaces Jekyll's defaults, so vendor/ and the
# bundler dirs must be listed here or CI tries to build the installed gems.
exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - README.md
  - _config.ci.yml
  - guestbook
