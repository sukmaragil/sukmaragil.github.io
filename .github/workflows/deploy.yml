name: Deploy site

# ONE workflow, ONE GitHub Pages site. Builds the Jekyll site and injects the
# standalone guestbook page into /guestbook/ of the same artifact.
# Do not add a second workflow that calls deploy-pages - a repo has only one
# Pages site and the two deploys would overwrite each other.
#
# Config lives on the "github-pages" ENVIRONMENT:
#   Settings -> Environments -> github-pages
#
#   Environment secrets
#     SUPABASE_URL       https://xxxxxxxx.supabase.co
#     SUPABASE_ANON_KEY  the anon public key (never service_role)
#
#   Environment variables (non-sensitive, all optional)
#     OPEN_FEEDBACK      true | false  show the guestbook input box (default true)
#     SUPABASE_TABLE     table name (default guestbook)
#     HOME_URL           guestbook back-link (defaults to the site's baseurl)
#
# With the secrets unset the guestbook still deploys, in browser-only mode.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      open_feedback:
        description: Show the guestbook input box
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Resolve open_feedback
        id: flag
        env:
          INPUT_VALUE: ${{ github.event.inputs.open_feedback }}
          VAR_VALUE: ${{ vars.OPEN_FEEDBACK }}
        run: |
          VALUE="$INPUT_VALUE"
          if [ -z "$VALUE" ]; then VALUE="$VAR_VALUE"; fi
          if [ "$VALUE" != "false" ]; then VALUE="true"; fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "Guestbook input box enabled: $VALUE"

      - name: Apply build-time config
        env:
          OPEN_FEEDBACK: ${{ steps.flag.outputs.value }}
        run: |
          printf 'open_feedback: %s\n' "$OPEN_FEEDBACK" > _config.ci.yml
          cat _config.ci.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config.ci.yml

      - name: Add standalone guestbook
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
          OPEN_FEEDBACK: ${{ steps.flag.outputs.value }}
          HOME_URL: ${{ vars.HOME_URL }}
        run: |
          set -eu

          SRC=guestbook/index.html
          if [ ! -f "$SRC" ]; then
            echo "No $SRC - skipping standalone guestbook."
            exit 0
          fi

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY environment secrets not set - guestbook deploys in browser-only mode."
          fi

          TABLE="${SUPABASE_TABLE:-}"
          if [ -z "$TABLE" ]; then TABLE=guestbook; fi

          # Back-link must respect baseurl: on a project repo the site root is
          # /<repo>/, not /. HOME_URL overrides when set.
          HOME="${HOME_URL:-}"
          if [ -z "$HOME" ]; then
            BASE=$(grep -m1 '^baseurl:' _config.yml | cut -d: -f2- | tr -d ' "' || true)
            HOME="${BASE%/}/"
          fi
          echo "Guestbook back-link: $HOME"

          mkdir -p _site/guestbook
          cp "$SRC" _site/guestbook/index.html
          OUT=_site/guestbook/index.html

          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL:-}|g" "$OUT"
          sed -i "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY:-}|g" "$OUT"
          sed -i "s|__SUPABASE_TABLE__|$TABLE|g" "$OUT"
          sed -i "s|__HOME_URL__|$HOME|g" "$OUT"
          sed -i "s|__OPEN_FEEDBACK__|${OPEN_FEEDBACK:-true}|g" "$OUT"

          if grep -q '__SUPABASE_URL__' "$OUT"; then
            echo "::error::placeholder substitution failed"
            exit 1
          fi
          echo "guestbook config injected"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
